apiVersion: v1
kind: Pod
metadata:
  name: postgres-security-test
  namespace: capstone
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: postgres
      image: postgres:16
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      env:
        - name: POSTGRES_PASSWORD
          value: temporary-test-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      volumeMounts:
        - name: test-data
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: test-data
      emptyDir: {}